<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
	<title>Agregar aviso de adopción</title>
    <link rel="stylesheet" type="text/css" href="./styles.css">

</head>

<body>
    <header>
        <h1>Sistema de Adopción de Mascotas</h1>
        <nav>
        <ul>
            <li><a href="index.html">Portada</a></li>
            <li><a href="agregar.html">Agregar aviso de adopción</a></li>
            <li><a href="listado.html">Ver listado de adopciones</a></li>
            <li><a href="estadisticas.html">Estadísticas</a></li>
        </ul>
        </nav>
    </header>

    <main>
        <h2>Agregar aviso de adopción</h2>
        <form name="myForm" method="post" enctype="multipart/form-data">
            <fieldset>
                <legend>¿Dónde?</legend>
                <label for="region">Región:</label>
                <select id="region" name="region">
                    <option value=""> Seleccione una región</option>
                </select><br>

                <label for="comuna">Comuna:</label>
                <select id="comuna" name="comuna">
                    <option value=""> Seleccione una comuna</option>
                </select><br>

                <label for="sector">Sector:</label>
                <input type="text" id="sector" name="sector" maxlength="100"><br>
            </fieldset>
            
            <fieldset>
                <legend>Contacto de esta publicación</legend>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" minlength="3" maxlength="200"><br>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" maxlength="100"><br>

                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono" placeholder="+569.12345678"><br>

                <label for="red">Contacto por:</label>
                <select id="red" name="red">
                    <option value="">Seleccione</option>
                    <option>WhatsApp</option>
                    <option>Telegram</option>
                    <option>X</option>
                    <option>Instagram</option>
                    <option>TikTok</option>
                    <option>Otra</option>
                </select>
                <input type="text" id="red_id" name="red_id" placeholder="ID o URL (min. 4, max. 50)">
                <button type="button" id="agregarRed">Agregar Red</button>

            </fieldset>

            <fieldset>
                <legend>¿Qué mascota ofrece en adopción?</legend>

                <label for="tipo">Tipo:</label>
                <select id="tipo" name="tipo"  >
                <option value="">Seleccione</option>
                <option value="gato">Gato</option>
                <option value="perro">Perro</option>
                </select>

                <label for="cantidad">Cantidad:</label>
                <input type="number" id="cantidad" name="cantidad" min="1">

                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" min="1">

                <label for="unidadEdad">Unidad:</label>
                <select id="unidadEdad" name="unidadEdad">
                <option value="">Seleccione</option>
                <option value="meses">Meses</option>
                <option value="años">Años</option>
                </select>

                <label for="fechaEntrega">Fecha disponible para entrega:</label>
                <input type="datetime-local" id="fechaEntrega" name="fechaEntrega">

                <label for="descripcion">Descripción:</label>
                <textarea id="descripcion" name="descripcion" rows="5" cols="50"></textarea>

                <label for="foto1">Fotos (1 a 5):</label>
                <input type="file" id="foto1" name="fotos[]" accept="image/*">
                <button type="button" id="agregarFoto">Agregar otra foto</button>
            </fieldset>
            
            <button type="submit">Agregar este aviso de adopción</button>
        </form>
    </main>
    <div id="val-box" hidden>
        <h3> id="val-msg"></h3>
        <ul id="val-list"></ul>
    </div>
    <script src="js/region_comuna.js"></script>
    <script src="js/verificar.js"></script>
</body>
